<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Media and Tech">
  <defs>
    <linearGradient id="plate" x1="18%" y1="12%" x2="86%" y2="92%">
      <stop offset="0%" stop-color="#0A4A82"/>
      <stop offset="55%" stop-color="#004179"/>
      <stop offset="100%" stop-color="#000E1F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#C9A000"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="248" fill="#EEF3F8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#FFCF00" stroke-width="2.5" opacity="0.55"/>
  <circle cx="256" cy="256" r="208" fill="url(#plate)"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>

  <!-- ===== Clear camera (media) ===== -->
  <g>
    <!-- Body -->
    <rect x="96" y="214" width="148" height="100" rx="16" fill="#FFFFFF"/>
    <!-- Top viewfinder / flash housing -->
    <path d="M128 214 V198 C128 190 134 184 142 184 H170 C178 184 184 190 184 198 V214 Z" fill="#FFFFFF"/>
    <!-- Shutter button -->
    <rect x="148" y="190" width="22" height="10" rx="3" fill="url(#gold)"/>
    <!-- Flash -->
    <circle cx="210" cy="232" r="7" fill="url(#gold)"/>
    <!-- Lens rings -->
    <circle cx="168" cy="264" r="34" fill="#001833"/>
    <circle cx="168" cy="264" r="34" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
    <circle cx="168" cy="264" r="22" fill="#0A4A82"/>
    <circle cx="168" cy="264" r="22" fill="none" stroke="#FFFFFF" stroke-width="1.25" opacity="0.25"/>
    <circle cx="168" cy="264" r="10" fill="#000E1F"/>
    <circle cx="162" cy="258" r="3.5" fill="#FFE566" opacity="0.9"/>
  </g>

  <!-- Center divider -->
  <line x1="256" y1="178" x2="256" y2="334" stroke="#FFCF00" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="4.5" fill="url(#gold)"/>

  <!-- ===== Code brackets (tech) ===== -->
  <g fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 198 L268 256 L300 314"/>
    <path d="M360 198 L392 256 L360 314"/>
  </g>
  <line x1="348" y1="210" x2="312" y2="302" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
</svg>
