name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Syntax-check entrypoints
        run: |
          node --check server.js
          node --check controllers/postController.js
          node --check controllers/telegramController.js
          node --check services/aiRewrite.js
          node --check services/telegramIngest.js
          node --check models/post.model.js
          node --check models/postTranslation.model.js
          node --check routes/telegramRoutes.js
